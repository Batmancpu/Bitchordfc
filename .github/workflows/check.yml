name: BitChord FC Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish the BitChord FC pre-release after Android phone checks pass"
        required: true
        default: true
        type: boolean

concurrency:
  group: bitchord-repository-workflows
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  android:
    name: Android phone tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          {
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY"
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET"
            printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER"
          } > local.properties

      - run: chmod +x gradlew

      - name: Run phone unit tests
        run: ./gradlew :app:testDevDebugUnitTest -Pbitchord.bundleWear=false

  release:
    name: Build and publish BitChord FC phone APK
    needs: android
    permissions:
      contents: write
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Calculate unique Android pre-release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(awk -F'"' '/^val defaultBitchordVersionName = / {print $2; exit}' build.gradle.kts)"
          if [[ -z "$BASE_VERSION" ]]; then
            echo "::error::Could not read defaultBitchordVersionName from build.gradle.kts"
            exit 1
          fi
          VERSION_NAME="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "BitChord FC pre-release: $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Generate one-off pre-release signing key
        shell: bash
        run: |
          set -euo pipefail
          STORE_FILE="bitchord-fc-prerelease.jks"
          STORE_PASSWORD="$(openssl rand -hex 24)"
          ALIAS="bitchordfc-prerelease"
          keytool -genkeypair -v -keystore "$STORE_FILE" -storetype JKS -storepass "$STORE_PASSWORD" -keypass "$STORE_PASSWORD" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BitChord FC Temporary Pre-release"
          {
            printf 'storeFile=%s\n' "$STORE_FILE"
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ALIAS"
            printf 'keyPassword=%s\n' "$STORE_PASSWORD"
          } > keystore.properties
          echo "::warning::This pre-release uses a one-off signing key. A later build with a different key cannot update it; uninstall this build before installing a future build."

      - name: Write local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          {
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY"
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET"
            printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER"
          } > local.properties

      - run: chmod +x gradlew

      - name: Build BitChord FC phone APK only
        run: >
          ./gradlew :app:assembleSpotifyRelease
          -Pbitchord.bundleWear=false
          -PbitchordVersionCode=${{ steps.version.outputs.code }}
          -PbitchordVersionName=${{ steps.version.outputs.name }}

      - name: Verify universal APK, package ID and signature
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          apks=(app/build/outputs/apk/spotify/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No BitChord FC APKs were produced."
            exit 1
          fi

          universal=""
          for apk in "${apks[@]}"; do
            base="$(basename "$apk")"
            if [[ "$base" != *"armeabi-v7a"* && "$base" != *"arm64-v8a"* && "$base" != *"x86_64"* ]]; then
              universal="$apk"
              break
            fi
          done
          if [[ -z "$universal" ]]; then
            echo "::error::Universal BitChord FC APK was not produced."
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK path is unavailable."
            exit 1
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$AAPT" || -z "$APKSIGNER" ]]; then
            echo "::error::Android APK verification tools are unavailable."
            exit 1
          fi

          APP_ID="$("$AAPT" dump badging "$universal" | awk -F"'" '/^package:/{print $2; exit}')"
          if [[ "$APP_ID" != "com.spotify.music" ]]; then
            echo "::error::Expected application ID com.spotify.music, found '$APP_ID'."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$universal"

          cp "$universal" "release-assets/BitChordFC-$VERSION_NAME.apk"
          (
            cd release-assets
            sha256sum ./*.apk > SHA256SUMS.txt
          )
          test -s "release-assets/BitChordFC-$VERSION_NAME.apk"
          ls -lh release-assets
          echo "Verified application ID: $APP_ID"

      - name: Preserve downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-fc-${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish BitChord FC pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: BitChord FC v${{ steps.version.outputs.name }} (Pre-release)
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Pre-release signed with a one-off CI key. To install a later build signed with a different key, uninstall this version first; uninstalling removes its app data.
          append_body: true
          files: release-assets/*
