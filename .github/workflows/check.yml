name: BitChord FC Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'wearos/protocol/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/check.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish BitChord FC after Android phone tests pass"
        required: true
        default: true
        type: boolean

concurrency:
  group: bitchordfc-android-ci-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android phone unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root is unavailable."
            exit 1
          fi
          install_sdk_package() {
            local package="$1"
            local attempt
            for attempt in 1 2 3; do
              if sdkmanager --install "$package"; then
                return 0
              fi
              echo "::warning::Retrying SDK package $package after failed attempt $attempt."
              rm -rf "$SDK_ROOT/.temp" "$SDK_ROOT/.downloadIntermediates"
              sleep $((attempt * 5))
            done
            echo "::error::Could not install Android SDK package $package after three attempts."
            return 1
          }
          install_sdk_package "ndk;27.0.12077973"
          install_sdk_package "cmake;3.22.1"
          test -x "$SDK_ROOT/ndk/27.0.12077973/ndk-build"
          test -d "$SDK_ROOT/cmake/3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Write optional local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          {
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY"
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET"
            printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER"
          } > local.properties
      - run: chmod +x gradlew
      - name: Run phone unit tests
        run: ./gradlew :app:testDevDebugUnitTest -Pbitchord.bundleWear=false

  release:
    name: Build and publish BitChord FC
    needs: android
    permissions:
      contents: write
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install pinned Android NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK root is unavailable."
            exit 1
          fi
          install_sdk_package() {
            local package="$1"
            local attempt
            for attempt in 1 2 3; do
              if sdkmanager --install "$package"; then
                return 0
              fi
              echo "::warning::Retrying SDK package $package after failed attempt $attempt."
              rm -rf "$SDK_ROOT/.temp" "$SDK_ROOT/.downloadIntermediates"
              sleep $((attempt * 5))
            done
            echo "::error::Could not install Android SDK package $package after three attempts."
            return 1
          }
          install_sdk_package "ndk;27.0.12077973"
          install_sdk_package "cmake;3.22.1"
          test -x "$SDK_ROOT/ndk/27.0.12077973/ndk-build"
          test -d "$SDK_ROOT/cmake/3.22.1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Calculate increasing app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_VERSION="$(awk -F'"' '/^val defaultBitchordVersionName = / { print $2; exit }' build.gradle.kts)"
          if [[ -z "$DEFAULT_VERSION" || "$DEFAULT_VERSION" != *.* ]]; then
            echo "::error::Could not read defaultBitchordVersionName from build.gradle.kts"
            exit 1
          fi
          VERSION_PREFIX="${DEFAULT_VERSION%.*}"
          VERSION_NAME="${VERSION_PREFIX}.${GITHUB_RUN_NUMBER}"
          VERSION_CODE=$((200000 + GITHUB_RUN_NUMBER))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "BitChord FC version: $VERSION_NAME (versionCode $VERSION_CODE)"
      - name: Configure persistent signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          STORE_FILE="bitchord-fc-release.jks"
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "::error::Configure KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD as repository Actions secrets before the first release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STORE_FILE"
          if [[ ! -s "$STORE_FILE" ]] || ! keytool -list -keystore "$STORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::The configured Android signing keystore is invalid or its credentials do not match."
            exit 1
          fi
          {
            printf 'storeFile=%s\n' "$STORE_FILE"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
      - name: Write optional local.properties
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}
        run: |
          {
            printf 'LASTFM_API_KEY=%s\n' "$LASTFM_API_KEY"
            printf 'LASTFM_SECRET=%s\n' "$LASTFM_SECRET"
            printf 'LISTEN_TOGETHER_SERVER=%s\n' "$LISTEN_TOGETHER_SERVER"
          } > local.properties
      - run: chmod +x gradlew
      - name: Build Fluid Cloud phone APK only
        run: >
          ./gradlew :app:assembleSpotifyRelease
          -Pbitchord.bundleWear=false
          -PbitchordVersionCode=${{ steps.version.outputs.code }}
          -PbitchordVersionName=${{ steps.version.outputs.name }}
      - name: Verify package ID, signature and APK
        id: verify
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p release-assets
          apks=(app/build/outputs/apk/spotify/release/*.apk)
          if (( ${#apks[@]} == 0 )); then
            echo "::error::No BitChord FC APK was produced."
            exit 1
          fi
          universal=""
          for apk in "${apks[@]}"; do
            name="$(basename "$apk")"
            if [[ "$name" != *"armeabi-v7a"* && "$name" != *"arm64-v8a"* && "$name" != *"x86_64"* ]]; then
              universal="$apk"
              break
            fi
          done
          if [[ -z "$universal" ]]; then
            echo "::error::Universal APK was not produced."
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$SDK_ROOT" ]]; then
            echo "::error::Android SDK path is unavailable."
            exit 1
          fi
          AAPT="$(find "$SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$AAPT" || -z "$APKSIGNER" ]]; then
            echo "::error::Android APK verification tools are unavailable."
            exit 1
          fi
          APP_ID="$("$AAPT" dump badging "$universal" | awk -F"'" '/^package:/{print $2; exit}')"
          if [[ "$APP_ID" != "com.spotify.music" ]]; then
            echo "::error::Expected com.spotify.music; found '$APP_ID'."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$universal"
          SIGNER_SHA256="$("$APKSIGNER" verify --print-certs "$universal" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print tolower($2); exit}')"
          if [[ ! "$SIGNER_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not read the APK signing certificate SHA-256 fingerprint."
            exit 1
          fi

          # The v1.9.8 release is the documented one-time migration boundary.
          # Every release after the first permanent-key release must retain the
          # exact same signer or it will not update in place on Android.
          if ! gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > previous-releases.json; then
            echo "::error::Could not list previous GitHub Releases; refusing to publish without checking signing continuity."
            exit 1
          fi
          PREVIOUS_RELEASE="$(jq -c '[.[] | select(.draft == false)] | .[0] // {}' previous-releases.json)"
          PREVIOUS_TAG="$(jq -r '.tag_name // empty' <<< "$PREVIOUS_RELEASE")"
          EXPECTED_SIGNER="$(jq -r '.body // ""' <<< "$PREVIOUS_RELEASE" | awk -F': ' '/^Signing certificate SHA-256: / { gsub(/\x60/, "", $2); print tolower($2); exit }')"
          if [[ -z "$PREVIOUS_TAG" ]]; then
            echo "::error::No previously published release found; refusing to publish without an established signing baseline."
            exit 1
          fi
          if [[ "$PREVIOUS_TAG" == "v1.9.8" && -z "$EXPECTED_SIGNER" ]]; then
            echo "::warning::One-time signing migration from v1.9.8. That old APK cannot be updated in place; uninstall it once before installing this release."
          elif [[ -z "$EXPECTED_SIGNER" ]]; then
            echo "::error::The previous release has no pinned signing certificate fingerprint; refusing to publish."
            exit 1
          elif [[ "$EXPECTED_SIGNER" != "$SIGNER_SHA256" ]]; then
            echo "::error::Signing certificate mismatch. Previous: $EXPECTED_SIGNER; current: $SIGNER_SHA256. Refusing an update-incompatible release."
            exit 1
          fi
          echo "signer_sha256=$SIGNER_SHA256" >> "$GITHUB_OUTPUT"
          cp "$universal" "release-assets/BitChordFC-$VERSION_NAME.apk"
          (
            cd release-assets
            sha256sum ./*.apk > SHA256SUMS.txt
          )
          test -s "release-assets/BitChordFC-$VERSION_NAME.apk"
          echo "Verified package ID: $APP_ID"
      - name: Preserve downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-fc-${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
      - name: Publish BitChord FC release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: BitChord FC v${{ steps.version.outputs.name }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          body: |
            Fluid Cloud Android build.
            Package ID: `com.spotify.music`.
            Signed with the repository's persistent signing key.
            Signing certificate SHA-256: `${{ steps.verify.outputs.signer_sha256 }}`
            Keep this signing certificate unchanged; releases with a different signer are blocked.
          files: release-assets/*
