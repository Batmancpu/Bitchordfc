name: Android Release APK

# Every merge to main (and every direct main push) publishes installable APKs
# to GitHub Releases. The original BitChord and the optional Fluid Cloud build
# are shipped side by side in the same release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Calculate unique Android release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -nE 's/^extra\["bitchordVersionName"\] = "([^"]+)".*/\1/p' build.gradle.kts | head -n 1)"
          if [[ -z "$BASE_VERSION" ]]; then
            echo "Could not read bitchordVersionName from build.gradle.kts" >&2
            exit 1
          fi
          VERSION_NAME="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          # Keep this above the existing versionCode (36) and monotonic across
          # every workflow run, so Android accepts future in-place upgrades.
          VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Publishing BitChord version $VERSION_NAME (versionCode $VERSION_CODE)"

      - name: Setup Secrets (Keystore & local.properties)
        shell: bash
        run: |
          set -euo pipefail
          echo "${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build original BitChord and BitChord FC
        run: >
          ./gradlew assembleProdRelease assembleSpotifyRelease
          -PbitchordVersionCode=${{ steps.version.outputs.code }}
          -PbitchordVersionName=${{ steps.version.outputs.name }}

      - name: Prepare clearly named APKs and checksums
        shell: bash
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          copy_variant() {
            local flavor="$1"
            local prefix="$2"
            local source_dir="app/build/outputs/apk/$flavor/release"
            local apks=("$source_dir"/*.apk)

            if [[ ! -d "$source_dir" || ! -f "${apks[0]:-}" ]]; then
              echo "No APKs found in $source_dir" >&2
              exit 1
            fi

            local universal=""
            local apk base abi
            for apk in "${apks[@]}"; do
              base="$(basename "$apk")"
              if [[ "$base" != *"armeabi-v7a"* &&
                    "$base" != *"arm64-v8a"* &&
                    "$base" != *"x86_64"* ]]; then
                universal="$apk"
                break
              fi
            done

            if [[ -z "$universal" ]]; then
              echo "Universal APK not found in $source_dir" >&2
              exit 1
            fi

            cp "$universal" "release-assets/$prefix-$VERSION_NAME.apk"

            for apk in "${apks[@]}"; do
              [[ "$apk" == "$universal" ]] && continue
              base="$(basename "$apk")"
              abi=""
              for candidate in armeabi-v7a arm64-v8a x86_64; do
                if [[ "$base" == *"$candidate"* ]]; then
                  abi="$candidate"
                  break
                fi
              done
              if [[ -n "$abi" ]]; then
                cp "$apk" "release-assets/$prefix-$VERSION_NAME_$abi.apk"
              fi
            done
          }

          copy_variant prod BitChord
          copy_variant spotify BitChordFC

          (
            cd release-assets
            sha256sum ./*.apk > SHA256SUMS.txt
          )

          echo "Release assets:"
          ls -lh release-assets

      - name: Preserve downloadable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-and-fluid-cloud-${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: BitChord + BitChord FC v${{ steps.version.outputs.name }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: release-assets/*
